name: ci

# By workflow_dispatch (on a pull request's head before it is merged: gh workflow run ci.yml --ref <branch>): the whole suite (make test) on Fedora, and the package check (make check-package: every oracle and golden digest,
# not the sabotage and perturbation arms, which run once) on both Debian releases and Ubuntu 24.04,
# on the cells check-matrix names (the quick set's while the release matrix is quick); on workflow_dispatch the packages built, their file lists checked and a consumer outside the tree built
# against each; omx-contract installed from the OpenMixer channel at the floor the packaging
# declares, and refused below its floor. The packages and the release workflow as a dry run only on workflow_dispatch
# (fast-release dispatches it on a release head). The fast checks, the documentation check among them, run on every
# pull request from public-sources.yml. Nothing is signed or published here. Every job reads this
# repository and other public ones, and runs on GitHub's runners.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # omx-contract's reader, render and install script, which data/ is read back through and the definitions header
  # rendered by, from this release tag: the floor packaging/deps.txt declares
  OMX_CONTRACT_REF: v3.21.0

concurrency:
  # Every dispatch has a group of its own (the run id) and is never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The cells the Debian and Fedora jobs below run on: the quick set's alone while OMX_RELEASE_MATRIX is quick, the whole
  # matrix when it is full (check-matrix; each cell carries its image, architecture and runner).
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cells: ${{ steps.m.outputs.cells }}
      deb: ${{ steps.m.outputs.deb }}
      count: ${{ steps.m.outputs.count }}
      deb-count: ${{ steps.m.outputs.deb-count }}
    steps:
      - id: m
        uses: Open-Mixer/.github/.github/actions/check-matrix@openmixer-v1
        with:
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          rpm-releases: '["45"]'
          rpm-arches: '["x86_64"]'
          deb-releases: ${{ vars.OMX_RELEASE_MATRIX == 'full' && '["bookworm", "trixie"]' || '["trixie"]' }}
          deb-arches: '["amd64", "arm64"]'
          x86-runner: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}

  test:
    name: make test (${{ matrix.cell.image }}, ${{ matrix.cell.arch }})
    runs-on: ${{ matrix.cell.runner }}
    needs: checks
    if: needs.checks.outputs.count != '0'
    # Run one make job per CPU (BUILDING.md: make -jN test is supported, and make gen-once holds the
    # one generation under -j8): serially the suite reached 39 to 43 minutes of this 60-minute limit
    # once the remaining-FX wave's oracles and perturbation scripts joined it, and one trixie run went
    # past it. Every check still runs.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # ruling D25: bookworm is a full cell, served its floors (omx-contract 3.18.0) only at the wave-end full release
        cell: ${{ fromJSON(needs.checks.outputs.cells) }}
    container:
      image: ${{ matrix.cell.image }}
    # debian images run sh by default, which has no pipefail
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the build tools
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y --setopt=tsflags=nodocs --setopt=install_weak_deps=False gcc make binutils gawk diffutils git curl tar gzip dnf5-plugins pkgconf-pkg-config
          else
            apt-get update -qq
            apt-get -o Dpkg::Options::=--force-unsafe-io install -y --no-install-recommends build-essential gawk diffutils git ca-certificates curl pkgconf dpkg-dev
          fi

      - uses: actions/checkout@v4

      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The build dependencies, omx-contract among them, from what the packaging declares: no version
      # is named here.
      # the channel serves Debian; an Ubuntu takes its trixie index (omx-contract is Architecture: all)
      - name: Add the OpenMixer repository
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          suite: ''

      - name: Install the build dependencies from the OpenMixer channel
        run: |
          set -euo pipefail
          if command -v dnf >/dev/null; then
            dnf builddep -y --setopt=tsflags=nodocs --setopt=install_weak_deps=False packaging/omx-dsp.spec
          else
            apt-get -o Dpkg::Options::=--force-unsafe-io build-dep -y --no-install-recommends ./
          fi
          pkg-config --modversion omx-contract
          sh tools/contract-include.sh

      - name: The version agrees everywhere it is written
        id: handback-version
        run: |
          set -euo pipefail
          v=$(make -s version)
          grep -q "^Version: $v\$" packaging/omx-dsp.spec
          head -1 debian/changelog | grep -q "^omx-dsp ($v) "
          # the test containers carry no node: the twins' version is read as text
          grep -q "^  \"version\": \"$v\",\$" ts/package.json

      - name: Every file a comment can be written in opens with its licence
        id: handback-spdx
        uses: Open-Mixer/.github/.github/actions/spdx-check@openmixer-v1

      # packaging/deps.txt is the one place a floor is written: the spec, debian/control and OMX_CONTRACT_REF follow it
      - name: The dependency floors are the ones packaging/deps.txt declares
        id: handback-deps
        uses: Open-Mixer/.github/.github/actions/deps-render@openmixer-v1

      - name: The release workflow builds arm on every tag
        id: handback-release-arm-gate
        run: tools/release-arm-gate-selftest.sh && tools/release-arm-gate-selftest.sh --sabotage

      - name: The picker chooses the newest published omx-contract below the floor (self-test, sabotage held)
        id: handback-below-floor-picker
        run: sh tools/below-floor-version-selftest.sh

      # the parallel jobs from the job's CPU quota and the runner's declared CPUs, never the host's nproc
      - name: The parallel jobs this runner may run
        uses: Open-Mixer/.github/.github/actions/jobs@openmixer-v1
        with:
          max: ${{ vars.OMX_RUNNER_CPUS || '3' }}
      # The sabotage and perturbation arms prove the tests and the source checks read text: neither depends on
      # the distro, so they run once, in the Fedora cell. The other cells run what the package builds run
      # (make check-package): every oracle and golden digest at every declared rate on their own toolchain.
      - name: make test
        id: handback-test
        if: startsWith(matrix.cell.image, 'fedora')
        # this job's container is thrown away after the job: the one place install-confined runs its check in place (#75)
        env:
          OMX_INSTALL_CONFINED_INNER: '1'
        run: make -j"$OMX_JOBS" test

      - name: make check-package
        id: handback-check-package
        if: ${{ !startsWith(matrix.cell.image, 'fedora') }}
        run: make -j"$OMX_JOBS" check-package

  # The sabotage of the range: the newest published omx-contract below the floor the spec declares, picked
  # by tools/below-floor-version.sh from the channel's own versions and installed with its signature checked,
  # must stop the build at once with a message that names the dependency, the floor and the version installed.
  # The curve function as WebAssembly (make wasm, tools/wasm-build.sh): the distribution's own clang, lld and wasi-libc,
  # nothing downloaded. Fedora is the reference; Debian trixie's package names are what this cell confirms or refutes.
  wasm:
    name: The WebAssembly build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:45", "debian:trixie"]
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the toolchain
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y --setopt=tsflags=nodocs --setopt=install_weak_deps=False make gcc git curl tar gzip pkgconf-pkg-config clang lld wasi-libc-devel wasi-libc-static dnf5-plugins
          else
            apt-get update -qq
            apt-get -o Dpkg::Options::=--force-unsafe-io install -y --no-install-recommends make gcc git ca-certificates curl pkgconf dpkg-dev clang lld wasi-libc
          fi
      - uses: actions/checkout@v4
      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Add the OpenMixer repository
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          suite: ${{ startsWith(matrix.image, 'ubuntu') && 'trixie' || '' }}
      - name: Install omx-contract at the floor
        run: |
          set -euo pipefail
          if command -v dnf >/dev/null; then dnf install -y --setopt=tsflags=nodocs --setopt=install_weak_deps=False omx-contract-devel; else apt-get -o Dpkg::Options::=--force-unsafe-io install -y --no-install-recommends libomx-contract-dev; fi
          sh tools/contract-include.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: make wasm, wasm-check and wasm-sabotage
        run: |
          set -euo pipefail
          make wasm wasm-check wasm-sabotage 2>&1 | tee /tmp/wasm.log
          wc -c build/wasm/omx-dsp.wasm
      - name: make wasm-loader-check and wasm-loader-sabotage (the install of the npm package tree, through its loader)
        run: |
          set -euo pipefail
          (cd ts && npm ci)
          make wasm-loader-check wasm-loader-sabotage 2>&1 | tee /tmp/wasm-loader.log

  # The TypeScript twins against the kernels (ts/: npm test), on the library this tree builds; the publish workflow runs
  # the same before it publishes, so a twin that disagrees is red here first.
  twins:
    name: The TypeScript twins agree with the kernels (${{ matrix.cell.suite }}, ${{ matrix.cell.arch }})
    runs-on: ${{ matrix.cell.runner }}
    needs: checks
    if: needs.checks.outputs.deb-count != '0'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.checks.outputs.deb) }}
    container:
      image: ${{ matrix.cell.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get -o Dpkg::Options::=--force-unsafe-io install -y --no-install-recommends build-essential gawk diffutils git ca-certificates curl pkgconf dpkg-dev
      - uses: actions/checkout@v4

      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Add the OpenMixer repository
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
      - name: Install the build dependencies from the OpenMixer channel
        run: apt-get -o Dpkg::Options::=--force-unsafe-io build-dep -y --no-install-recommends ./
      # the parallel jobs from the job's CPU quota and the runner's declared CPUs, never the host's nproc
      - name: The parallel jobs this runner may run
        uses: Open-Mixer/.github/.github/actions/jobs@openmixer-v1
        with:
          max: ${{ vars.OMX_RUNNER_CPUS || '3' }}
      - name: The library the twins are checked against
        run: make -j"$OMX_JOBS" lib
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: The shared curve vectors, native
        run: |
          apt-get -o Dpkg::Options::=--force-unsafe-io install -y --no-install-recommends python3
          make -j"$OMX_JOBS" curve-vectors curve-vectors-sabotage
      - name: The shared curve vectors, through the native door and the WebAssembly door
        run: |
          set -euo pipefail
          (cd ts && npm ci && npm run build)
          make -j"$OMX_JOBS" curve-vectors-wasm curve-vectors-sabotage
      - name: npm test
        working-directory: ts
        run: |
          set -o pipefail
          npm ci
          npm test 2>&1 | tee /tmp/ts-test.log
          grep -q 'linked against the tree' /tmp/ts-test.log
      # the parallel jobs from the job's CPU quota and the runner's declared CPUs, never the host's nproc
      - name: The parallel jobs this runner may run
        uses: Open-Mixer/.github/.github/actions/jobs@openmixer-v1
        with:
          max: ${{ vars.OMX_RUNNER_CPUS || '3' }}
      - name: The EQ Q range moves the kernel and the twin together (omx-dsp#5)
        run: make -j"$OMX_JOBS" eq-q-range-sabotage

  contract-floor:
    name: below the omx-contract floor the build refuses (${{ matrix.cell.image }}, ${{ matrix.cell.arch }})
    runs-on: ${{ matrix.cell.runner }}
    needs: checks
    if: needs.checks.outputs.count != '0'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.checks.outputs.cells) }}
    container:
      image: ${{ matrix.cell.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the build tools
        run: |
          set -euo pipefail
          if command -v dnf >/dev/null; then
            dnf install -y --setopt=tsflags=nodocs --setopt=install_weak_deps=False git gcc make gawk dnf5-plugins pkgconf-pkg-config
          else
            apt-get update -qq
            apt-get -o Dpkg::Options::=--force-unsafe-io install -y --no-install-recommends git ca-certificates curl build-essential gawk pkgconf
          fi

      - name: Add the OpenMixer repository
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1

      - uses: actions/checkout@v4

      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The newest published version strictly below the floor, read from the channel itself (the signature check stays on:
      # no --nogpgcheck), never a version typed here. Refused by name when the channel publishes none below the floor.
      - name: Install the newest published omx-contract below the floor, its signature checked
        run: |
          set -euo pipefail
          floor="$(sh tools/contract-include.sh --floor)"
          if command -v dnf >/dev/null; then
            # -y takes the FreeREAC key the add-openmixer step enabled (the list stops at its prompt otherwise); the signature check stays on
            dnf -y list --showduplicates omx-contract-devel > avail.txt
            awk '$1 ~ /^omx-contract-devel\./ {print $2}' avail.txt > versions.txt
            pkg="$(sh tools/below-floor-version.sh "$floor" < versions.txt)"
          else
            apt-get -o Dpkg::Options::=--force-unsafe-io update -qq
            apt-cache madison libomx-contract-dev | awk -F'|' '{n=$1; v=$2; gsub(/ /,"",n); gsub(/ /,"",v); if (n=="libomx-contract-dev") print v}' > versions.txt
            pkg="$(sh tools/below-floor-version.sh --deb "$floor" < versions.txt)"
          fi
          old="$(printf '%s' "$pkg" | sed 's/-[^-]*$//')"
          echo "below-floor: the newest published omx-contract below the floor $floor is $pkg (omx-contract $old)"
          if command -v dnf >/dev/null; then
            dnf install -y --setopt=tsflags=nodocs "omx-contract-devel-$pkg"
          else
            # the data package is pinned to the same version: the devel depends on it at that version, and apt otherwise picks the newest (3.20.0)
            apt-get -o Dpkg::Options::=--force-unsafe-io install -y --no-install-recommends "libomx-contract-dev=$pkg" "omx-contract-data=$pkg"
          fi
          test "$(pkg-config --modversion omx-contract)" = "$old"
          echo "OLD=$old" >> "$GITHUB_ENV"

      - name: make lib fails, naming omx-contract, the floor and the version installed
        run: |
          set +e -uo pipefail
          floor="$(sh tools/contract-include.sh --floor)"
          make lib > out.txt 2>&1; rc=$?
          cat out.txt
          [ "$rc" != 0 ] || { echo "make lib built against omx-contract $OLD, below the floor $floor"; exit 1; }
          ! ls build/*.o >/dev/null 2>&1 || { echo "make compiled before refusing"; exit 1; }
          for word in omx-contract "$floor" "$OLD"; do
            grep -q "contract-include:.*$word" out.txt || { echo "the refusal does not name '$word'"; exit 1; }
          done
          echo "refused as it must be: $(grep -m1 'contract-include:' out.txt)"

  # data/ read back through omx-contract's reader (make contract-dir) and the committed definitions header held
  # equal to its render (make definitions-check), and the completeness proof over data/ and recipes/answers/
  # (make contract-proof). They need node and an omx-contract checkout, which no other job has.
  contract:
    name: data/ read back through omx-contract's reader, the committed header its render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Fetch omx-contract at OMX_CONTRACT_REF and install it
        run: |
          set -euo pipefail
          case $OMX_CONTRACT_REF in
            v[0-9]*.[0-9]*.[0-9]*) ref=refs/tags/$OMX_CONTRACT_REF ;;
            *) echo "OMX_CONTRACT_REF is $OMX_CONTRACT_REF: pin a release tag" >&2; exit 1 ;;
          esac
          git init -q /tmp/omx-contract
          git -C /tmp/omx-contract fetch -q --depth 1 https://github.com/Open-Mixer/omx-contract "$ref"
          git -C /tmp/omx-contract checkout -q FETCH_HEAD
          # with its devDependencies: since 3.18.0 a tag's lib/ is built from src/ by its prepare script (tsc)
          npm ci --prefix /tmp/omx-contract
          # the Makefile finds omx-contract by pkg-config: the checkout itself, installed under a scratch prefix
          make -C /tmp/omx-contract install PREFIX=/tmp/omx-contract-prefix
          echo "PKG_CONFIG_PATH=/tmp/omx-contract-prefix/share/pkgconfig" >> "$GITHUB_ENV"

      - name: make definitions-check
        run: make definitions-check OMX_CONTRACT=/tmp/omx-contract

      - name: make contract-dir
        run: make contract-dir OMX_CONTRACT=/tmp/omx-contract

      - name: The devel package ships the test support the consumers read
        run: make test-support-install

      - name: make eq-defaults-table
        run: make eq-defaults-table

      - name: make contract-proof
        run: make contract-proof OMX_CONTRACT=/tmp/omx-contract

      - name: make contract-tests
        run: make contract-tests OMX_CONTRACT=/tmp/omx-contract

      # every unit data/ and recipes/answers/ state is a PARAM_UNITS standard symbol, its sabotage held (omx-contract#193)
      - name: make units-check
        run: make units-check OMX_CONTRACT=/tmp/omx-contract

  # The libFuzzer harnesses of fuzz/ (clang, libFuzzer, ASan, UBSan, the library's contracts), each run for 60 s from
  # its seed corpus; red on any crash or broken contract, the crashing input uploaded. Then the checks prove
  # themselves: every sabotage patch found at the check it names, every record met by its own check on its own seed,
  # and every harness at its coverage floor with every check reached. omx-contract's header is read from a checkout
  # at OMX_CONTRACT_REF through OMX_CONTRACT_INC (no node and no install needed to fuzz).
  fuzz:
    name: fuzz (60 s per harness)
    runs-on: ubuntu-latest
    # a backstop: six harnesses of 60 s, their build, and the three proofs, which run seeds only, end well inside this
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install clang, libFuzzer's runtime and llvm-cov
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang libclang-rt-dev llvm

      - name: Fetch omx-contract at OMX_CONTRACT_REF
        run: |
          set -euo pipefail
          case $OMX_CONTRACT_REF in
            v[0-9]*.[0-9]*.[0-9]*) ref=refs/tags/$OMX_CONTRACT_REF ;;
            *) echo "OMX_CONTRACT_REF is $OMX_CONTRACT_REF: pin a release tag" >&2; exit 1 ;;
          esac
          git init -q /tmp/omx-contract
          git -C /tmp/omx-contract fetch -q --depth 1 https://github.com/Open-Mixer/omx-contract "$ref"
          git -C /tmp/omx-contract checkout -q FETCH_HEAD
          echo "OMX_CONTRACT_INC=/tmp/omx-contract/include" >> "$GITHUB_ENV"

      - name: Build the harnesses (clang, libFuzzer, ASan, UBSan, contracts)
        run: make fuzz

      - name: Fuzz each harness for 60 s
        id: handback-fuzz
        run: make fuzz-run FUZZ_TIME=60

      # a property no breakage can make fail checks nothing: each patch must make its harness abort on the seed it
      # names, at the check it names
      - name: Find every sabotage patch, each at its own check
        run: make fuzz-sabotage

      # every check records the one-line bug it catches and the seed it catches it on, and each record, alone, makes
      # that check abort on that seed; a check with neither a record nor a not-a-property line is red
      - name: Meet every check's record
        run: make fuzz-records

      # the seed corpus must keep reaching the library lines it reaches today and every check
      - name: Hold the coverage floor
        run: make fuzz-coverage

      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz/findings/
          if-no-files-found: ignore

  rpm:
    name: omx-dsp-devel (fc45, ${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    # %check runs make check-package, as the deb job's build does
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]  # x86_64 only: Fedora 45 aarch64 is not built (owner ruling 2026-11-19)
    container:
      image: fedora:45
    steps:
      - name: Install the build tools
        run: |
          dnf install -y --setopt=tsflags=nodocs --setopt=install_weak_deps=False git rpm-build dnf5-plugins gcc make tar gzip diffutils pkgconf-pkg-config python3

      - name: Add the OpenMixer repository
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: Open-Mixer/.github/.github/actions/build-rpm@openmixer-v1

      - name: Check the file list
        run: |
          set -euo pipefail
          rpm=$(ls rpms/omx-dsp-devel-[0-9]*.${{ matrix.arch }}.rpm)
          rpm -qp --qf '[%{FILEMODES:perms} %{FILENAMES}\n]' "$rpm" | grep -v '^d' | cut -d' ' -f2 \
            | sed 's,/usr/lib64/,/usr/lib*/,' | grep -v '^/usr/include/omxdsp/' | sort > files.txt
          printf '%s\n' '/usr/lib*/libomxdsp.a' '/usr/lib*/libomxdsp-contracts.a' '/usr/lib*/libomxdsp-tsan.a' \
            '/usr/lib*/pkgconfig/omxdsp.pc' '/usr/lib*/pkgconfig/omxdsp-contracts.pc' '/usr/lib*/pkgconfig/omxdsp-tsan.pc' \
            /usr/share/doc/omx-dsp-devel/README.md \
            /usr/share/licenses/omx-dsp-devel/LICENSE /usr/bin/omx-dsp-copy-check \
            /usr/share/man/man1/omx-dsp-copy-check.1.gz \
            /usr/share/omxdsp/omx-dsp-exports.json /usr/share/omxdsp/hrp_peaking_corpus.h \
            /usr/share/omxdsp/meter-view-vectors.json /usr/share/omxdsp/rta-bands-vectors.json \
            /usr/share/omxdsp/rta-delta-vectors.json /usr/share/omxdsp/hrp-place-vectors \
            /usr/share/omxdsp/test-support/log10f_cr.h /usr/share/omxdsp/test-support/log10f_subst.h \
            /usr/share/omxdsp/tsan-gate.sh | sort > expected.txt
          diff -u expected.txt files.txt
          # the listing is read from a file: grep -q stops at its first match, and under pipefail the rpm it
          # cut off (SIGPIPE, exit 141) fails the step once the listing is longer than the pipe holds
          rpm -qlp "$rpm" > listing.txt
          grep -q '^/usr/include/omxdsp/fx/omx_delay.h$' listing.txt
          grep -q '^/usr/include/omxdsp/fx/omx_reverb.h$' listing.txt
          # the gate is its own package: its binary, man page and share directory, and nothing of it in the devel one
          ! grep -q 'rt-gate' listing.txt
          rpm -qlp "$(ls rpms/omx-rt-gate-[0-9]*.${{ matrix.arch }}.rpm)" > listing.txt
          for f in bin/omx-rt-gate share/man/man1/omx-rt-gate.1.gz share/omxdsp/rt-gate/tables/forbidden.tbl \
                   share/omxdsp/rt-gate/tables/classes.tbl share/omxdsp/rt-gate/tables/lv2.abi share/omxdsp/rt-gate/tables/clap.abi \
                   share/omxdsp/rt-gate/tables/pipewire.abi share/omxdsp/rt-gate/tables/omxdsp.abi share/omxdsp/rt-gate/omx-dsp.tags \
                   share/omxdsp/rt-gate/graphs/omx_fbs_detect.ci; do grep -q "^/usr/$f\$" listing.txt; done
          ! grep -E '\.so(\.|$)' listing.txt
          # the contract directory is read at run time: it is omx-dsp-contract's, never the devel package's (omx-contract#150)
          ! grep -q '^/usr/share/omx-contract/' listing.txt
          rpm -qpR "$rpm" | grep -q '^omx-dsp-contract = '
          rpm -qlp "$(ls rpms/omx-dsp-wasm-[0-9]*.noarch.rpm)" > listing.txt
          # the packaged loader ships beside the module it loads (tools/wasm-loader-check.mjs)
          grep -q '^/usr/share/omx-dsp/dist/index.js$' listing.txt
          grep -q '^/usr/share/omx-dsp/wasm/omx-dsp.wasm$' listing.txt
          contract=$(ls rpms/omx-dsp-contract-[0-9]*.noarch.rpm)
          rpm -qlp "$contract" > contract.txt
          grep -q '^/usr/share/omx-contract/contract.d/3/omx-dsp/MANIFEST.json$' contract.txt
          grep -q '^/usr/share/omx-contract/contract.d/3/omx-dsp/render.json$' contract.txt
          # every definition file of data/ is installed, under the same relative path
          diff <(cd data && find . -name '*.json' | sed 's|^\./|/usr/share/omx-contract/contract.d/3/omx-dsp/|' | sort) \
               <(grep '^/usr/share/omx-contract/contract.d/3/omx-dsp/.*\.json$' contract.txt | grep -v '/MANIFEST\.json$' | sort)

      - name: A consumer builds against omx-dsp-devel
        run: |
          set -euo pipefail
          dnf install -y --setopt=tsflags=nodocs --setopt=install_weak_deps=False rpms/omx-dsp-devel-[0-9]*.${{ matrix.arch }}.rpm rpms/omx-dsp-contract-[0-9]*.noarch.rpm
          test "$(pkg-config --modversion omxdsp)" = "$(make -s version)"
          pkg-config --cflags omxdsp | grep -q -- '-ffp-contract=off'
          gcc $(pkg-config --cflags omxdsp) -Itest/fx -include test/support/log10f_subst.h -O2 -o /tmp/golden test/fx/delay_golden.test.c $(pkg-config --libs omxdsp)
          /tmp/golden test/golden/delay.sha256
          gcc $(pkg-config --cflags omxdsp) -Itest/fx -include test/support/log10f_subst.h -O2 -o /tmp/golden-reverb test/fx/reverb_golden.test.c $(pkg-config --libs omxdsp)
          /tmp/golden-reverb test/golden/reverb.sha256
          gcc $(pkg-config --cflags omxdsp-contracts) -O2 -o /tmp/flavour test/omxdsp_flavour.c $(pkg-config --libs omxdsp-contracts)
          /tmp/flavour

      - name: The packaged loader loads the packaged module, in a clean root
        run: |
          set -euo pipefail
          # Node 26 (#130): Fedora 45's plain nodejs is Node 22, and the build's nodejs22-bin holds /usr/bin/node, so
          # nodejs26-bin takes it over (--allowerasing)
          dnf install -y --setopt=tsflags=nodocs --setopt=install_weak_deps=False --allowerasing nodejs26 nodejs26-bin rpms/omx-dsp-wasm-[0-9]*.noarch.rpm
          node --version | grep -q '^v26\.'
          node tools/wasm-loader-check.mjs /usr/share/omx-dsp

      - uses: actions/upload-artifact@v4
        with:
          name: omx-dsp-rpms-fc45-${{ matrix.arch }}
          path: rpms/*.rpm
          if-no-files-found: error
          retention-days: 7

  deb:
    name: libomxdsp-dev (${{ matrix.cell.suite }}, ${{ matrix.cell.arch }})
    if: github.event_name == 'workflow_dispatch' && needs.checks.outputs.deb-count != '0'
    runs-on: ${{ matrix.cell.runner }}
    needs: checks
    # the package build runs make check-package (dh_auto_test), which takes under 15 minutes on a hosted
    # runner; make test, with the sabotage and perturbation arms, ran here until it no longer fit 60
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # the quick set's deb cells (trixie arm64), the whole matrix when OMX_RELEASE_MATRIX is full
        cell: ${{ fromJSON(needs.checks.outputs.deb) }}
    container:
      image: ${{ matrix.cell.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get -o Dpkg::Options::=--force-unsafe-io install -y --no-install-recommends ca-certificates curl git dpkg-dev debhelper build-essential lintian gawk pkgconf python3

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Take omx-contract from the OpenMixer channel
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1

      - uses: Open-Mixer/.github/.github/actions/build-deb@openmixer-v1

      - name: A consumer builds against libomxdsp-dev
        run: |
          set -euo pipefail
          apt-get -o Dpkg::Options::=--force-unsafe-io install -y --no-install-recommends ./debs/libomxdsp-dev_*.deb ./debs/omx-dsp-contract_*.deb ./debs/omx-rt-gate_*.deb
          dpkg -L libomxdsp-dev > listing.txt   # read from a file: see the RPM job's listing
          # the contract directory is omx-dsp-contract's (omx-contract#150)
          ! grep -q '^/usr/share/omx-contract/' listing.txt
          ! grep -E '\.so(\.|$)' listing.txt
          for a in libomxdsp libomxdsp-contracts libomxdsp-tsan; do grep -q "/$a\.a\$" listing.txt; done
          for p in omxdsp omxdsp-contracts omxdsp-tsan; do grep -q "/pkgconfig/$p\.pc\$" listing.txt; done
          # the gate is its own package (libomxdsp-dev is Multi-Arch: same, no executable belongs there)
          ! grep -q 'rt-gate' listing.txt
          dpkg -L omx-rt-gate > listing.txt
          for f in /usr/bin/omx-rt-gate /usr/share/man/man1/omx-rt-gate.1.gz /usr/share/omxdsp/rt-gate/tables/forbidden.tbl \
                   /usr/share/omxdsp/rt-gate/omx-dsp.tags /usr/share/omxdsp/rt-gate/graphs/omx_fbs_detect.ci; do grep -q "^$f\$" listing.txt; done
          dpkg -L omx-dsp-contract > listing.txt
          grep -q '^/usr/share/omx-contract/contract.d/3/omx-dsp/MANIFEST.json$' listing.txt
          diff <(cd data && find . -name '*.json' | sed 's|^\./|/usr/share/omx-contract/contract.d/3/omx-dsp/|' | sort) \
               <(grep '^/usr/share/omx-contract/contract.d/3/omx-dsp/.*\.json$' listing.txt | grep -v '/MANIFEST\.json$' | sort)
          test "$(pkg-config --modversion omxdsp)" = "$(make -s version)"
          gcc $(pkg-config --cflags omxdsp) -Itest/fx -include test/support/log10f_subst.h -O2 -o /tmp/golden test/fx/delay_golden.test.c $(pkg-config --libs omxdsp)
          /tmp/golden test/golden/delay.sha256
          gcc $(pkg-config --cflags omxdsp) -Itest/fx -include test/support/log10f_subst.h -O2 -o /tmp/golden-reverb test/fx/reverb_golden.test.c $(pkg-config --libs omxdsp)
          /tmp/golden-reverb test/golden/reverb.sha256
          gcc $(pkg-config --cflags omxdsp-contracts) -O2 -o /tmp/flavour test/omxdsp_flavour.c $(pkg-config --libs omxdsp-contracts)
          /tmp/flavour

      # Node 26 (#130): Debian's archive carries no Node 26
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: The packaged loader loads the packaged module, in a clean root
        run: |
          set -euo pipefail
          apt-get -o Dpkg::Options::=--force-unsafe-io install -y --no-install-recommends ./debs/omx-dsp-wasm_*.deb
          node --version | grep -q '^v26\.'
          dpkg -L omx-dsp-wasm > listing.txt
          grep -q '^/usr/share/omx-dsp/dist/index.js$' listing.txt
          grep -q '^/usr/share/omx-dsp/wasm/omx-dsp.wasm$' listing.txt
          node tools/wasm-loader-check.mjs /usr/share/omx-dsp

  release-dry-run:
    name: release workflow, dry run
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      issues: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      publish: false
      arm: false  # arm64/aarch64 build at release only
