name: release

# A version tag builds omx-dsp-devel (RPM, fc45 x86_64; Fedora 45 aarch64 is not built, owner ruling 2026-11-19) and libomxdsp-dev (DEB, bookworm and
# trixie, amd64 and arm64), signs them, publishes them into the rpm/ and deb/ trees of the OpenMixer
# Pages repository and attaches the RPMs to the GitHub release. Anything else builds unsigned trees and
# publishes nothing. Everything is in Open-Mixer/.github; the secrets are the organisation's.

# A manual run with staged on (never a tag) builds fc45 x86_64 and trixie amd64 only, against the staging channel, and
# publishes them, signed, to the staging channel (staging/rpm and staging/deb of the channel repository), where the
# next layer of the release chain finds them by adding the staging channel beside the real one. Nothing reaches the
# real channel, and the real release still publishes once from the v<version> tag (Open-Mixer/.github build-rpm.yml
# and build-deb.yml).

on:
  push:
    tags: ['v*']
    # a merge to devel builds the real package and publishes it to staging (Open-Mixer/.github#289)
    branches: [devel]
  workflow_dispatch:
    inputs:
      arm:
        description: 'Build the arm64 DEBs too (a dispatched release needs them, as a tag push does); no Fedora aarch64 RPM is built'
        type: boolean
        default: true
      staged:
        description: 'Build fc45 x86_64 and trixie amd64 only and publish them to the staging channel for the next layer; publishes nothing to the real channel'
        type: boolean
        default: false
  workflow_call:
    inputs:
      runner:
        type: string
        default: 'ubuntu-latest'
        description: "Runner for the x86 jobs"
      arm:
        type: boolean
        default: true
        description: "Build the arm64 DEBs too; the pull-request dry run passes false (arm builds run at release only); no Fedora aarch64 RPM is built"
      staged:
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  rpm:
    uses: Open-Mixer/.github/.github/workflows/build-rpm.yml@openmixer-v1
    with:
      staged: ${{ inputs.staged == true }}
      package-name: omx-dsp
      binary-names: omx-dsp-devel omx-rt-gate
      publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
      needs-mod-host: false
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      # x86_64 only: the owner ruling of 2026-11-19 stops building Fedora 45 aarch64 (the deb arm64 cells stay)
      arch-matrix: '["x86_64"]'
      channel-deps: true
    secrets: inherit

  # beside the RPMs: the two publish jobs share one concurrency group, so their pushes never race
  deb:
    uses: Open-Mixer/.github/.github/workflows/build-deb.yml@openmixer-v1
    with:
      staged: ${{ inputs.staged == true }}
      package-name: omx-dsp
      binary-names: libomxdsp-dev omx-rt-gate omx-dsp-contract
      publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
      dependencies: ''
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      arch-matrix: ${{ (github.event_name != 'push' && inputs.arm == false) && '["amd64"]' || '["amd64", "arm64"]' }}
      requires: ''
      channel-deps: true
    secrets: inherit

  # the generated C API reference, fetched by the website from the release assets
  api-docs:
    needs: [rpm, deb]
    # the same doxygen the documentation gate runs on (public-sources.yml)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends doxygen

      - name: Build the HTML
        run: |
          set -euo pipefail
          make docs
          tar -czf "omx-dsp-api-docs-$(make -s version).tar.gz" -C build/docs html

      # the dry run proves the build and keeps the tarball for inspection; only a tag publishes it
      - name: Keep the tarball (dry run)
        if: ${{ github.ref_type != 'tag' || github.event_name != 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: omx-dsp-api-docs
          path: omx-dsp-api-docs-*.tar.gz

      - name: Attach to the release
        if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" omx-dsp-api-docs-*.tar.gz --clobber
