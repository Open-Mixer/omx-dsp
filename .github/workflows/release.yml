name: release

# Two paths, one build. A manual run with staged on BUILDS omx-dsp-devel and omx-rt-gate (RPM, fc45 x86_64 and
# aarch64: the full matrix for every package, owner ruling 2026-11-26) and libomxdsp-dev, omx-rt-gate and
# omx-dsp-contract (DEB, amd64 and arm64) through Open-Mixer/.github's build-rpm.yml and build-deb.yml, signed, into the staging channel (staging/rpm and
# staging/deb of the channel repository), where the next layer builds against them. The quick set by default (matrix:
# quick, the staging of a devel run); a promotion candidate is dispatched with matrix: full, the only staged tree a tag
# can promote (promote-staged refuses one that lacks a release or architecture). Without staged, a dispatch (and the
# ci.yml dry run that calls this workflow) builds unsigned trees and publishes nothing.
#
# A version tag v<make version> PROMOTES and never builds: on the commit the staged build recorded, and that commit on
# main (fast-forward main to it first), Open-Mixer/.github promote-staged.yml copies the identical signed files that
# commit left under staging/ to the channel root, rpm and deb, re-signs the repository metadata, checks the channel
# serves the same bytes and that they install, and creates the GitHub release; the C API reference is attached to it.
# What the layers above were built against is what ships. npm follows the promotion, never the bare tag: publish.yml
# runs when this workflow completes for a v* tag and publishes only when its promote jobs all succeeded.
#
# A manual run with version (and commit) set is a dry run of the promotion: it finds and checks the staged build and
# publishes nothing.

on:
  push:
    tags: ['v*']
    # a merge to devel builds the real package and publishes it to staging (Open-Mixer/.github#289)
    branches: [devel]
  workflow_dispatch:
    inputs:
      arm:
        description: 'Build the arm64 DEBs too (a dispatched release needs them); the RPMs build x86_64 and aarch64 either way'
        type: boolean
        default: true
      staged:
        description: 'Build and publish to the staging channel for the next layer (the matrix below); publishes nothing to the real channel'
        type: boolean
        default: false
      matrix:
        description: 'quick (fc45 x86_64, trixie arm64: the staging of every devel run) or full (every release and architecture: a promotion candidate, the only tree a tag can promote)'
        type: choice
        options: [quick, full]
        default: quick
      version:
        description: 'A dry run of the promotion: the staged version to find (no v). Set, nothing is built'
        type: string
        default: ''
      commit:
        description: 'A dry run of the promotion: the commit of the staged build, short or full'
        type: string
        default: ''
  workflow_call:
    inputs:
      runner:
        type: string
        default: 'ubuntu-latest'
        description: "Runner for the x86 jobs"
      arm:
        type: boolean
        default: true
        description: "Build the arm64 DEBs too; the pull-request dry run passes false (arm builds run at release only); the RPMs build x86_64 and aarch64 either way"
      staged:
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  # A tag names the library's version and sits on main: devel -> testing -> main by fast-forward, then the tag
  check:
    name: The tag is the version, on main
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag names the library version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="v$(make -s version)"
          [ "$TAG" = "$want" ] || { echo "::error::tag $TAG is not $want (make version)"; exit 1; }
      - name: The tag is on main
        run: |
          git fetch -q origin main
          main=$(git rev-parse -q --verify origin/main) || { echo "::error::no origin/main to hold the tag to"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" "$main" || { echo "::error::the tag's commit $GITHUB_SHA is not on main ($main): fast-forward main to it first"; exit 1; }

  rpm:
    # the build path: a dispatch or the ci.yml dry run, never a tag (a tag promotes what this staged)
    if: github.ref_type != 'tag' && !inputs.version
    uses: Open-Mixer/.github/.github/workflows/build-rpm.yml@openmixer-v1
    with:
      staged: ${{ inputs.staged == true }}
      # a dispatch off main in a wave (the dry run ci.yml calls this with) builds and checks installability against that
      # wave's devel channel and its bases above staging, as ci.yml's own jobs read them: a dispatch read the real
      # channel alone, which serves none of the wave's lower layers (Open-Mixer/.github#329; plugin-qualify 39ca667).
      # A staging dry run publishes nothing (publish: false); never a release, a tag or a staged run
      staging: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.staged != true && vars.OMX_DEVEL_CHANNEL != '' }}
      channel-level: ${{ (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.staged != true) && vars.OMX_DEVEL_CHANNEL || '' }}
      matrix: ${{ inputs.matrix || '' }}
      package-name: omx-dsp
      binary-names: omx-dsp-devel omx-rt-gate
      publish: false
      needs-mod-host: false
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      channel-deps: true
    secrets: inherit

  # beside the RPMs: the two publish jobs share one concurrency group, so their pushes never race
  deb:
    # the build path: a dispatch or the ci.yml dry run, never a tag (a tag promotes what this staged)
    if: github.ref_type != 'tag' && !inputs.version
    uses: Open-Mixer/.github/.github/workflows/build-deb.yml@openmixer-v1
    with:
      staged: ${{ inputs.staged == true }}
      # a dispatch off main in a wave (the dry run ci.yml calls this with) builds and checks installability against that
      # wave's devel channel and its bases above staging, as ci.yml's own jobs read them: a dispatch read the real
      # channel alone, which serves none of the wave's lower layers (Open-Mixer/.github#329; plugin-qualify 39ca667).
      # A staging dry run publishes nothing (publish: false); never a release, a tag or a staged run
      staging: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.staged != true && vars.OMX_DEVEL_CHANNEL != '' }}
      channel-level: ${{ (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.staged != true) && vars.OMX_DEVEL_CHANNEL || '' }}
      matrix: ${{ inputs.matrix || '' }}
      package-name: omx-dsp
      binary-names: libomxdsp-dev omx-rt-gate omx-dsp-contract
      publish: false
      dependencies: ''
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      arch-matrix: ${{ (github.event_name != 'push' && inputs.arm == false) && '["amd64"]' || '["amd64", "arm64"]' }}
      requires: ''
      channel-deps: true
    secrets: inherit

  # The tag path: the staged build becomes the release, byte for byte (no rebuild, no re-sign). binary-names are the
  # packages both kinds build, which every release and architecture must hold; every file of the commit goes along.
  # The rpm architectures are the build's: the shared default, x86_64 and aarch64.
  promote:
    if: ${{ !cancelled() && ((github.ref_type == 'tag' && needs.check.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
    needs: check
    uses: Open-Mixer/.github/.github/workflows/promote-staged.yml@openmixer-v1
    with:
      package-name: omx-dsp
      binary-names: omx-rt-gate
      version: ${{ inputs.version || '' }}
      commit: ${{ inputs.commit || '' }}
    secrets: inherit

  # the generated C API reference, fetched by the website from the release assets: kept by a build run, attached to the
  # release a promotion created
  api-docs:
    needs: [rpm, deb, promote]
    if: ${{ !cancelled() && ((github.ref_type == 'tag' && needs.promote.result == 'success') || (needs.rpm.result == 'success' && needs.deb.result == 'success')) }}
    # the same doxygen the documentation gate runs on (public-sources.yml)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends doxygen

      - name: Build the HTML
        run: |
          set -euo pipefail
          make docs
          tar -czf "omx-dsp-api-docs-$(make -s version).tar.gz" -C build/docs html

      # the dry run proves the build and keeps the tarball for inspection; only a promoted tag publishes it
      - name: Keep the tarball (dry run)
        if: ${{ github.ref_type != 'tag' || github.event_name != 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: omx-dsp-api-docs
          path: omx-dsp-api-docs-*.tar.gz

      - name: Attach to the release
        if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" omx-dsp-api-docs-*.tar.gz --clobber
