name: Publish the TypeScript twins to npm

# Publishes @openmixer/omx-dsp (ts/: the TypeScript twins of omx-dsp kernels) to
# npmjs.org by npm trusted publishing (OIDC, no token anywhere), modelled on omx-contract's publish.yml. npmjs.com
# trusts the CALLER of the publish by repository + workflow filename (+ environment when one is set there; none is):
#   Repository: Open-Mixer/omx-dsp    Workflow filename: publish.yml    Environment: (none)
# A version tag publishes (the library's own tag: ts/package.json carries the library version); a manual dispatch
# is a dry run unless asked otherwise. Only the public repository publishes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and run `npm publish --dry-run` only (npm skips the OIDC exchange on a dry run)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The one cell the publish builds on: trixie arm64, the quick set's deb cell (check-matrix gives it its image and runner)
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deb: ${{ steps.m.outputs.deb }}
      deb-count: ${{ steps.m.outputs.deb-count }}
    steps:
      - id: m
        uses: Open-Mixer/.github/.github/actions/check-matrix@openmixer-v1
        with:
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          deb-releases: '["trixie"]'
          deb-arches: '["arm64"]'
          x86-runner: ${{ vars.OMX_RUNNER || 'ubuntu-latest' }}

  publish:
    if: github.repository == 'Open-Mixer/omx-dsp' && needs.checks.outputs.deb-count != '0'
    needs: checks
    runs-on: ${{ matrix.cell.runner }}
    strategy:
      matrix:
        cell: ${{ fromJSON(needs.checks.outputs.deb) }}
    container:
      image: ${{ matrix.cell.image }}
    defaults:
      run:
        shell: bash
    # job-level: a workflow-level id-token grant does not reliably reach the job
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get -o Dpkg::Options::=--force-unsafe-io install -y --no-install-recommends build-essential gawk diffutils git ca-certificates curl pkgconf dpkg-dev
      - uses: actions/checkout@v4
      - name: Add the OpenMixer repository
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
      - name: Install the build dependencies from the OpenMixer channel
        run: |
          set -euo pipefail
          apt-get -o Dpkg::Options::=--force-unsafe-io build-dep -y --no-install-recommends ./
      # the parallel jobs from the job's CPU quota and the runner's declared CPUs, never the host's nproc
      - name: The parallel jobs this runner may run
        uses: Open-Mixer/.github/.github/actions/jobs@openmixer-v1
        with:
          max: ${{ vars.OMX_RUNNER_CPUS || '3' }}
      - name: The library the twins are checked against
        run: make -j"$OMX_JOBS" lib
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: npm 11 (trusted publishing needs >= 11.5.1)
        run: |
          npm install -g npm@'^11'
          npm --version
      - name: The twins agree with the kernels before they are published
        working-directory: ts
        run: |
          set -o pipefail
          npm ci
          npm test 2>&1 | tee /tmp/ts-test.log
          grep -q 'linked against the tree' /tmp/ts-test.log
      - name: The package version is the library version (and the tag)
        working-directory: ts
        run: |
          v=$(node -p "require('./package.json').version")
          [ "$v" = "$(make -s -C .. version)" ] || { echo "ts/package.json $v is not the library's $(make -s -C .. version)"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ]; then [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "tag ${GITHUB_REF_NAME} is not v$v"; exit 1; }; fi
      - name: Publish @openmixer/omx-dsp
        working-directory: ts
        env:
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}
        run: npm publish --provenance --access public $DRY
