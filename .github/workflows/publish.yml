name: Publish the TypeScript twins to npm

# Publishes @openmixer/omx-dsp (ts/: the TypeScript twins of omx-dsp kernels) to
# npmjs.org by npm trusted publishing (OIDC, no token anywhere), modelled on omx-contract's publish.yml. npmjs.com
# trusts the CALLER of the publish by repository + workflow filename (+ environment when one is set there; none is):
#   Repository: Open-Mixer/omx-dsp    Workflow filename: publish.yml    Environment: (none)
# npm follows the promotion, never the bare tag (owner ruling 2026-11-24: npm latest at the promotion). A v* tag runs
# release.yml, whose promote job makes the staged build the release; this workflow runs when that run completes and
# publishes only when it was a tag push of this repository, concluded success, and every job of its promote call read
# success: a refused promotion (a tag not on main, an incomplete staged tree) publishes nothing. It checks out the
# tag's commit, never the default branch the run event starts on (ts/package.json carries the library version). A
# manual dispatch is a dry run unless asked otherwise. Only the public repository publishes.

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and run `npm publish --dry-run` only (npm skips the OIDC exchange on a dry run)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The one cell the publish builds on: trixie arm64, the quick set's deb cell (check-matrix gives it its image and runner)
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      deb: ${{ steps.m.outputs.deb }}
      deb-count: ${{ steps.m.outputs.deb-count }}
    steps:
      # a release run of a v* tag push: the promotion itself, job by job, not only the run's conclusion (gh is on this
      # runner, not in the publish cell's container); a red gate leaves publish skipped
      - name: The release run promoted the tag
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs" --jq '.jobs[] | [.name, (.conclusion // "none")] | @tsv' > jobs.tsv
          cat jobs.tsv
          promote=$(grep -c '^promote / ' jobs.tsv || true)
          [ "$promote" -gt 0 ] || { echo "::error::release run $RUN of $TAG has no promote job: nothing was promoted, npm is not published"; exit 1; }
          # only a dry-run-only job of the promotion ("..., nothing is published": the unsigned trees) may be skipped on a
          # tag; every other promote job must succeed, a skipped install check or release gate included
          bad=$(grep '^promote / ' jobs.tsv | awk -F'\t' '$2 != "success" && !($2 == "skipped" && $1 ~ /, nothing is published$/)' || true)
          [ -z "$bad" ] || { echo "::error::the promotion of $TAG did not succeed, npm is not published:"; echo "$bad"; exit 1; }
          # the jobs that put the release in the channel each succeeded: none of them skipped
          for job in 'Promote the RPMs' 'Promote the DEBs' 'The channel serves the same bytes' 'GitHub release'; do
            grep -qxF "promote / $job"$'\t'success jobs.tsv || { echo "::error::the promotion of $TAG has no successful '$job', npm is not published"; exit 1; }
          done
      - id: m
        uses: Open-Mixer/.github/.github/actions/check-matrix@openmixer-v1
        with:
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          deb-releases: '["trixie"]'
          deb-arches: '["arm64"]'
          x86-runner: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}

  publish:
    # a dispatch (dry run by default), or a release run of a v* tag push here that concluded success
    if: >-
      github.repository == 'Open-Mixer/omx-dsp' && needs.checks.outputs.deb-count != '0' && (github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
        && startsWith(github.event.workflow_run.head_branch, 'v')
        && github.event.workflow_run.head_repository.full_name == github.repository))
    needs: checks
    runs-on: ${{ matrix.cell.runner }}
    strategy:
      matrix:
        cell: ${{ fromJSON(needs.checks.outputs.deb) }}
    container:
      image: ${{ matrix.cell.image }}
    defaults:
      run:
        shell: bash
    # job-level: a workflow-level id-token grant does not reliably reach the job
    permissions:
      contents: read
      id-token: write
    env:
      # the tag and its commit: the release run's for a promotion, the dispatched ref's for a dry run
      TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get -o Dpkg::Options::=--force-unsafe-io install -y --no-install-recommends build-essential gawk diffutils git ca-certificates curl pkgconf dpkg-dev
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Add the OpenMixer repository
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          # a pull request into devel, or a dispatch off main, in a wave reads that wave's devel channel and its base above staging
          devel-channel: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_CHANNEL || '' }}
          devel-base: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_BASE || '' }}
      - name: Install the build dependencies from the OpenMixer channel
        run: |
          set -euo pipefail
          apt-get -o Dpkg::Options::=--force-unsafe-io build-dep -y --no-install-recommends ./
      # the parallel jobs from the job's CPU quota and the runner's declared CPUs, never the host's nproc
      - name: The parallel jobs this runner may run
        uses: Open-Mixer/.github/.github/actions/jobs@openmixer-v1
        with:
          max: ${{ vars.OMX_RUNNER_CPUS || '3' }}
      - name: The library the twins are checked against
        run: make -j"$OMX_JOBS" lib
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'
      - name: npm 11 (trusted publishing needs >= 11.5.1)
        run: |
          npm install -g npm@'^11'
          npm --version
      - name: The twins agree with the kernels before they are published
        working-directory: ts
        run: |
          set -o pipefail
          npm ci
          npm test 2>&1 | tee /tmp/ts-test.log
          grep -q 'linked against the tree' /tmp/ts-test.log
      - name: The package version is the library version (and the tag)
        working-directory: ts
        run: |
          v=$(node -p "require('./package.json').version")
          [ "$v" = "$(make -s -C .. version)" ] || { echo "ts/package.json $v is not the library's $(make -s -C .. version)"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then [ "$TAG" = "v$v" ] || { echo "::error::tag $TAG is not v$v"; exit 1; }; fi
      - name: Publish @openmixer/omx-dsp
        working-directory: ts
        env:
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}
        run: npm publish --provenance --access public $DRY
