name: public-sources
# The fast checks, on every pull request: the trigger gate (no other workflow of this repository runs on a push or a
# pull request), and the shared checks from Open-Mixer/.github (this pull request's commit messages, no tracked file
# pointing into a private repository, no local copy of the checks, the public layout). Each takes seconds. The builds,
# the test suites, the packages and the fuzzing are in the other workflows, run by workflow_dispatch (ci.yml on a pull
# request's head before it is merged) and on a v* tag.
on:
  pull_request:
concurrency:
  group: public-sources-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  trigger-gate:
    name: only this workflow runs on a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/trigger-gate@openmixer-v1
        with:
          lint-workflow: public-sources.yml
  docs:
    name: make docs-check (every installed header's public declarations, against a baseline that only shrinks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends doxygen

      # docs/doxygen-baseline.txt at the pull request's base: a row this head adds to it is red. A base
      # without the file has nothing to shrink from, and the head's own copy stands in.
      - name: make docs-check
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          mkdir -p build/docs
          git show FETCH_HEAD:docs/doxygen-baseline.txt > build/docs/baseline-base.txt 2>/dev/null \
            || cp docs/doxygen-baseline.txt build/docs/baseline-base.txt
          make docs-check DOCS_BASELINE_BASE=build/docs/baseline-base.txt

      - name: make docs-sabotage
        run: make docs-sabotage
  # the checks every OpenMixer repository runs on what it publishes: commit messages, private references, and no
  # local copy of either (Open-Mixer/.github's public-sources-check)
  public-sources:
    uses: Open-Mixer/.github/.github/workflows/public-sources-check.yml@openmixer-v1
